# EximPhone - base stack. Dev/prod specifics live in the override files.
# Networks: front (nginx) / back (services) / data (postgres, redis, garage; internal only).
x-go-service: &go-service
  restart: unless-stopped
  networks: [back]
  environment: &go-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    HTTP_ADDR: ":8080"

services:
  nginx:
    build: {context: ., dockerfile: frontend/Dockerfile}
    image: eximphone-nginx
    environment:
      # Per-IP request limits (raise them only for load tests: see docs/deployment.md)
      NGINX_LOGIN_RATE: ${NGINX_LOGIN_RATE:-5r/s}
      NGINX_API_RATE: ${NGINX_API_RATE:-50r/s}
      NGINX_LOGIN_BURST: ${NGINX_LOGIN_BURST:-10}
      NGINX_API_BURST: ${NGINX_API_BURST:-200}
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [front, back]
    depends_on:
      api: {condition: service_healthy}
      media: {condition: service_healthy}
      provisioning: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 4s
      retries: 5

  api:
    <<: *go-service
    build: {context: ./services, args: {SERVICE: api}}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      garage: {condition: service_healthy}
    networks: [back, data]
    environment:
      <<: *go-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      MESSAGE_KEY: ${MESSAGE_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      TURN_SECRET: ${TURN_SECRET}
      TURN_PUBLIC_HOST: ${PUBLIC_IP}
      MEDIA_URL: http://media:8080
      SIP_KEY: ${SIP_KEY}
      SIP_DOMAIN: ${SIP_DOMAIN}
      RECORDING_KEY: ${RECORDING_KEY}
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_ATTR: ${LDAP_USER_ATTR}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  sip:
    <<: *go-service
    build: {context: ./services, args: {SERVICE: sip}}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      media: {condition: service_healthy}
    networks: [back, data]
    ports: ["5060:5060/udp", "5060:5060/tcp", "5061:5061/tcp"]
    volumes: ["./nginx/certs:/certs:ro"]
    environment:
      <<: *go-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SIP_KEY: ${SIP_KEY}
      SIP_DOMAIN: ${SIP_DOMAIN}
      PUBLIC_IP: ${PUBLIC_IP}
      SIP_REQUIRE_TLS: ${SIP_REQUIRE_TLS:-false}
      SIP_REQUIRE_SRTP: ${SIP_REQUIRE_SRTP:-false}
      SIP_TLS_CERT: /certs/server.crt
      SIP_TLS_KEY: /certs/server.key
      API_URL: http://api:8080
      MEDIA_URL: http://media:8080

  media:
    <<: *go-service
    build: {context: ./services, args: {SERVICE: media}}
    # RTP needs real source addresses and a wide UDP range; in production use network_mode: host (see docs/deployment.md).
    ports: ["10000-10200:10000-10200/udp"]
    networks: [back, data]
    environment:
      <<: *go-env
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MEDIA_PUBLIC_IP: ${PUBLIC_IP}
      RECORDING_KEY: ${RECORDING_KEY}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      API_URL: http://api:8080
    tmpfs: ["/tmp"]
    depends_on: {garage: {condition: service_healthy}}

  turn:
    <<: *go-service
    build: {context: ./services, args: {SERVICE: turn}}
    ports: ["3478:3478/udp", "3478:3478/tcp", "49152-49200:49152-49200/udp"]
    environment:
      <<: *go-env
      TURN_SECRET: ${TURN_SECRET}
      PUBLIC_IP: ${PUBLIC_IP}

  provisioning:
    <<: *go-service
    build: {context: ./services, args: {SERVICE: provisioning}}
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [back, data]
    environment:
      <<: *go-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SIP_KEY: ${SIP_KEY}
      PUBLIC_IP: ${PUBLIC_IP}
      SIP_REQUIRE_TLS: ${SIP_REQUIRE_TLS:-false}
      SIP_REQUIRE_SRTP: ${SIP_REQUIRE_SRTP:-false}

  worker:
    <<: *go-service
    build: {context: ./services, args: {SERVICE: worker}}
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    networks: [back, data]
    environment:
      <<: *go-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_ATTR: ${LDAP_USER_ATTR}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      INITIAL_IT_ADMINS: ${INITIAL_IT_ADMINS:-}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-365}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    networks: [data]
    volumes: [./db/migrations:/migrations:ro]
    depends_on: {postgres: {condition: service_healthy}}
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 4s
      retries: 10

  garage:
    build: ./ops/garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes: [garagedata:/data]
    networks: [data]
    healthcheck:
      # Healthy only once layout, key and buckets exist.
      test: ["CMD", "garage", "bucket", "info", "recordings"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  front: {}
  back: {}
  data: {internal: true}

volumes:
  pgdata:
  redisdata:
  garagedata:
