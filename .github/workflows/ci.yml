name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23", cache-dependency-path: services/go.sum}
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with: {working-directory: services}
      - run: go test -race -cover ./...

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, sip, media, turn, provisioning, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t eximphone/${{ matrix.service }}:ci services
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eximphone/${{ matrix.service }}:ci
          severity: CRITICAL
          exit-code: "1"
