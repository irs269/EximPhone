# Test deployment on a VPS (see scripts/deploy-test.sh): the base stack plus a mock directory whose
# accounts and passwords are generated per installation. The directory is reachable only from the
# internal Docker network. NOT for production: use the real Active Directory and docker-compose.prod.yml.
services:
  ldap-mock:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Exim Bank
      LDAP_DOMAIN: exim.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    volumes:
      - ./ldap-mock/employees.generated.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/employees.ldif:ro
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=exim,dc=local -D cn=admin,dc=exim,dc=local -w $${LDAP_ADMIN_PASSWORD} -s base dn"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    depends_on:
      ldap-mock: {condition: service_healthy}
