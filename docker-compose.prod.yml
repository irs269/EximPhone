# Production override. Secrets MUST come from a real .env / Docker secrets, never .env.example.
# media publishes an explicit UDP range (10000 shared by every WebRTC leg, 10001-10200 one per phone leg)
# instead of network_mode: host; see docs/deployment.md for the reasons and the alternative.
services:
  nginx:
    volumes:
      - certs:/etc/nginx/certs:ro
  sip:
    volumes:
      - certs:/certs:ro
    environment:
      # Phones must use SIP over TLS and SRTP in production.
      SIP_REQUIRE_TLS: "true"
      SIP_REQUIRE_SRTP: "true"
  provisioning:
    environment:
      SIP_REQUIRE_TLS: "true"
      SIP_REQUIRE_SRTP: "true"
  api: {deploy: {resources: {limits: {memory: 512M}}}}
  media: {deploy: {resources: {limits: {memory: 1G}}}}
volumes:
  certs:
